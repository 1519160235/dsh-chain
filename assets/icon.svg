<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
  <title>思维链记忆</title>
  <desc>八个记忆池环绕中心节点，表示分级记忆与被想起时才连接的思维链。</desc>

  <rect width="512" height="512" rx="112" fill="#12181F"/>

  <g stroke="#2E4A5C" stroke-width="3" opacity="0.85">
    <line x1="256" y1="256" x2="256" y2="152"/>
    <line x1="256" y1="256" x2="330" y2="180"/>
    <line x1="256" y1="256" x2="360" y2="256"/>
    <line x1="256" y1="256" x2="330" y2="332"/>
    <line x1="256" y1="256" x2="256" y2="360"/>
    <line x1="256" y1="256" x2="182" y2="332"/>
    <line x1="256" y1="256" x2="152" y2="256"/>
    <line x1="256" y1="256" x2="182" y2="180"/>
  </g>

  <g stroke="#1F3340" stroke-width="2" opacity="0.6">
    <line x1="256" y1="152" x2="330" y2="180"/>
    <line x1="330" y1="180" x2="360" y2="256"/>
    <line x1="360" y1="256" x2="330" y2="332"/>
    <line x1="330" y1="332" x2="256" y2="360"/>
    <line x1="256" y1="360" x2="182" y2="332"/>
    <line x1="182" y1="332" x2="152" y2="256"/>
    <line x1="152" y1="256" x2="182" y2="180"/>
    <line x1="182" y1="180" x2="256" y2="152"/>
  </g>

  <g fill="#3D6E85">
    <circle cx="330" cy="180" r="13"/>
    <circle cx="360" cy="256" r="13"/>
    <circle cx="330" cy="332" r="13"/>
    <circle cx="256" cy="360" r="13"/>
    <circle cx="182" cy="332" r="13"/>
    <circle cx="152" cy="256" r="13"/>
    <circle cx="182" cy="180" r="13"/>
  </g>

  <circle cx="256" cy="152" r="19" fill="#4EC9A0"/>
  <circle cx="256" cy="152" r="30" fill="none" stroke="#4EC9A0" stroke-width="2.5" opacity="0.45"/>

  <circle cx="256" cy="256" r="34" fill="#E8F4F1"/>
  <circle cx="256" cy="256" r="52" fill="none" stroke="#E8F4F1" stroke-width="2" opacity="0.25"/>
  <circle cx="256" cy="256" r="15" fill="#12181F"/>
</svg>