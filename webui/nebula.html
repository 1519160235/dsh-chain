<!doctype html>
<meta charset="utf-8">
<title>思维链星云</title>
<!--
  视觉移植自 dsh-chain 的 lib/client.js（MIT，原作者 末苍和她的大肥鱼）。
  不是照感觉重画：元素树、数值、CSS、渐变、逐帧更新规则都照搬，
  只把 React 换成一个 h() + 手写 tick。

  原版关键参数（勿改）：
    SPHERE_R = 0.40    R = min(w,h)*0.46    FOCAL = 2.4
    球体 r=R*0.40 / 大气层 r=R*0.46 / 边缘光 #ffb066 · #ffc78a（暖橙）
    记忆球 (1.05+1.45*w)*k*(0.30+0.70*openE)
    池团 64 颗微粒，rr = cbrt((i+1)/N)*(R*0.048)
-->
<style>
  html,body{margin:0;height:100%;background:#04060a}
  .chg-root{
    position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
    background:radial-gradient(ellipse at 50% 46%,#070b14 0%,#04060a 55%,#020307 100%);
    color:#e6edf7;font-size:12px;
    font-family:ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;
  }
  .chg-bar{
    display:flex;align-items:center;gap:8px;flex:none;padding:7px 10px;
    border-bottom:1px solid rgba(120,150,200,.08);font-size:11px;letter-spacing:.2px;
  }
  .chg-k{color:rgba(190,205,230,.55)}
  .chg-btn{
    border:1px solid rgba(140,175,225,.22);background:rgba(24,34,52,.5);
    color:rgba(205,218,240,.82);border-radius:999px;padding:2px 9px;font-size:11px;cursor:pointer;
  }
  .chg-btn[data-on="1"]{background:rgba(90,140,220,.26);border-color:rgba(150,190,255,.5);color:#eaf2ff}
  .chg-stage{position:relative;flex:1;min-height:0}
  .chg-svg{
    width:100%;height:100%;display:block;touch-action:none;cursor:grab;
    user-select:none;-webkit-user-select:none;
  }
  .chg-svg *{user-select:none;-webkit-user-select:none}
  .chg-svg[data-dragging="1"]{cursor:grabbing}
  .chg-svg[data-dragging="1"] .chg-tip{visibility:hidden}
  .chg-item{cursor:pointer}
  .chg-tip{
    font-size:12px;font-weight:500;fill:#edf3ff;pointer-events:none;
    paint-order:stroke;stroke:#070b13;stroke-width:4px;stroke-linejoin:round;
    font-family:ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;
  }
  .chg-tip-pool{font-size:12px;fill:rgba(228,238,255,.88)}
  .chg-panel{
    position:absolute;top:10px;right:10px;bottom:10px;width:min(330px,calc(100% - 20px));
    overflow:auto;background:rgba(12,18,30,.82);backdrop-filter:blur(14px);
    border:1px solid rgba(130,165,220,.18);border-radius:14px;padding:14px 15px;
    box-shadow:0 18px 50px rgba(0,0,0,.5);display:none;
  }
  .chg-panel[data-in="1"]{display:block}
  .chg-panel h4{margin:0 0 8px;font-size:14px;line-height:1.45;font-weight:600}
  .chg-pool-tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:999px;margin-bottom:9px}
  .chg-field{margin:9px 0;font-size:11.5px;line-height:1.6}
  .chg-field-k{color:rgba(170,190,220,.6);font-size:10px;letter-spacing:.4px;display:block;margin-bottom:2px}
  .chg-back{
    margin-top:12px;width:100%;border:1px solid rgba(140,175,225,.28);
    background:rgba(30,42,64,.6);color:rgba(215,228,246,.9);border-radius:9px;padding:6px;
    font-size:11.5px;cursor:pointer;
  }
  .chg-empty{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    color:rgba(180,196,222,.55);padding:24px;text-align:center;
  }
</style>

<div class="chg-root">
  <div class="chg-bar" id="bar"></div>
  <div class="chg-stage" id="stage">
    <svg class="chg-svg" id="svg"></svg>
    <div class="chg-panel" id="panel"></div>
    <div class="chg-empty" id="empty">还没有记忆。让麦麦做个决定，或在「记忆列表」里写一条。</div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ============================================================ 原版参数（勿改）
  const SPHERE_R = 0.40;
  const SPHERE_R_DRAW = 0.40;
  const FOCAL = 2.4;
  const FOCAL_SCALE = 0.46;
  const CAP_ANGLE = 0.72;
  const RING_SHARE = 0.25;
  const CLUSTER_N = 64;
  const FPS_MS = 33;

  const POOL_SPEC = [
    { key: 'core',         label: '核心',     color: '#ffd24a' },
    { key: 'fact',         label: '事实',     color: '#b9a6ff' },
    { key: 'skillRule',    label: '铁律',     color: '#ff4d4f' },
    { key: 'skillExp',     label: '经验',     color: '#59d98e' },
    { key: 'dailyCore',    label: '核心日常', color: '#2f6bff' },
    { key: 'dailyPartial', label: '片面日常', color: '#7fd4ff' },
    { key: 'emotion',      label: '情绪',     color: '#ffd6e7' },
    { key: 'hippocampus',  label: '海马体',   color: '#f2f7ff' },
  ];
  const POOL_MAP = {};
  POOL_SPEC.forEach(p => { POOL_MAP[p.key] = p; });
  const BAND_KEYS = POOL_SPEC.map(p => p.key);

  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');
  const barEl = document.getElementById('bar');
  const panelEl = document.getElementById('panel');
  const emptyEl = document.getElementById('empty');

  let data = { nodes: [], edges: [], bridges: [], pools: [], stats: {} };
  let laid = { pos: {}, mem: [], pools: [], linkPairs: [], evi: [] };
  let map = {};
  let topIds = {};
  let labels = false;   // 原版默认关闭：只显示粒子，点「标签」才出字
  let yaw = 0.6, pitch = 0.26, zoom = 1, openE = 0.55;
  let vyaw = 0, vpitch = 0;
  let dragging = false, lastX = 0, lastY = 0, moved = 0;
  let t = 0, last = 0, introStart = 0;

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const cos = Math.cos, sin = Math.sin;

  function hash01(str) {
    let hsh = 2166136261;
    for (let i = 0; i < str.length; i++) {
      hsh ^= str.charCodeAt(i);
      hsh = Math.imul(hsh, 16777619);
    }
    return ((hsh >>> 0) % 100000) / 100000;
  }
  const poolColor = key => (POOL_MAP[key] || POOL_MAP.dailyPartial).color;
  const poolLabel = key => (POOL_MAP[key] || POOL_MAP.dailyPartial).label;

  // ============================================================ 迷你 h()
  const KEEP_CAMEL = { viewBox: 1, gradientUnits: 1, patternUnits: 1, preserveAspectRatio: 1 };
  function toAttr(k) {
    if (KEEP_CAMEL[k]) return k;
    return k.replace(/[A-Z]/g, m => '-' + m.toLowerCase());
  }
  function h(tag, props) {
    const el = document.createElementNS(NS, tag);
    const kids = Array.prototype.slice.call(arguments, 2);
    if (props) {
      for (const k in props) {
        const v = props[k];
        if (k === 'key') continue;
        if (k === 'ref') { if (typeof v === 'function') v(el); continue; }
        if (k === 'className') { el.setAttribute('class', v); continue; }
        if (k === 'style') { for (const s in v) el.style[s] = v[s]; continue; }
        if (k.slice(0, 2) === 'on' && typeof v === 'function') {
          el.addEventListener(k.slice(2).toLowerCase(), v);
          continue;
        }
        if (v === null || v === undefined || v === false) continue;
        el.setAttribute(toAttr(k), String(v));
      }
    }
    for (const kid of kids.flat(9)) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    }
    return el;
  }
  function slot(id) {
    return el => { (map[id] = map[id] || {}).__el = el; };
  }

  // ============================================================ 布局
  function memoryPosition(node) {
    const key = node.pool || 'dailyPartial';
    const seed = node.id || '';
    const index = Math.max(0, BAND_KEYS.indexOf(key));
    const total = BAND_KEYS.length;
    const centerY = 1 - (index + 0.5) * 2 / total;
    const phase = index * 2.39996323;
    const ring = Math.sqrt(1 - centerY * centerY);
    const center = [ring * cos(phase), centerY, ring * sin(phase)];

    const phi = hash01(seed + 'a') * Math.PI * 2;
    const cosTheta = 1 - hash01(seed + 'area') * (1 - cos(CAP_ANGLE));
    const sinTheta = Math.sqrt(1 - cosTheta * cosTheta);
    const tangent = [-sin(phase), 0, cos(phase)];
    const bitangent = [
      center[1] * tangent[2],
      center[2] * tangent[0] - center[0] * tangent[2],
      -center[1] * tangent[0],
    ];
    let radius = SPHERE_R * (0.985 + 0.03 * hash01(seed + 'r'));
    let point = center.map((v, i) =>
      radius * (v * cosTheta + sinTheta * (tangent[i] * cos(phi) + bitangent[i] * sin(phi)))
    );

    if (hash01(seed + 'band') < RING_SHARE) {
      const ang = hash01(seed + 'band-a') * Math.PI * 2;
      radius = SPHERE_R * (1.045 + 0.05 * hash01(seed + 'band-r'));
      point = [cos(ang) * radius, (hash01(seed + 'band-y') - 0.5) * SPHERE_R * 0.16, sin(ang) * radius];
    }
    return { x: point[0], y: point[1], z: point[2] };
  }

  function computeLayout(nodes, edges, bridges) {
    const pos = {};
    const mem = nodes.map(n => ({
      id: n.id, pool: n.p, weight: n.w, label: n.t, recalled: n.k, eviCount: n.e,
    }));
    mem.forEach(n => { pos[n.id] = memoryPosition(n); });

    const pools = [];
    BAND_KEYS.forEach(key => {
      const members = mem.filter(n => n.pool === key);
      if (!members.length) return;
      let x = 0, y = 0, z = 0;
      members.forEach(n => { const p = pos[n.id]; x += p.x; y += p.y; z += p.z; });
      x /= members.length; y /= members.length; z /= members.length;
      const len = Math.hypot(x, y, z) || 1;
      pools.push({
        key, count: members.length,
        cx: (x / len) * SPHERE_R * 0.98,
        cy: (y / len) * SPHERE_R * 0.98,
        cz: (z / len) * SPHERE_R * 0.98,
      });
    });

    const evi = [];
    mem.forEach(n => {
      const cnt = Math.min(n.eviCount || 0, 4);
      for (let i = 0; i < cnt; i++) {
        const ang = hash01(n.id + 'ev' + i) * Math.PI * 2;
        evi.push({
          id: n.id + ':ev' + i, parent: n.id, pool: n.pool,
          ox: cos(ang) * 0.012, oy: sin(ang) * 0.012,
          oz: (hash01(n.id + 'evz' + i) - 0.5) * 0.012,
        });
      }
    });

    const pairs = [];
    const seen = {};
    (edges || []).forEach(e => {
      if (!pos[e.s] || !pos[e.d]) return;
      const key = e.s + '>' + e.d;
      if (seen[key]) return;
      seen[key] = 1;
      pairs.push([e.s, e.d, 'event']);
    });
    const bestOf = {};
    mem.forEach(n => {
      if (!bestOf[n.pool] || n.weight > bestOf[n.pool].weight) bestOf[n.pool] = n;
    });
    (bridges || []).forEach(b => {
      const a = bestOf[b.a], c = bestOf[b.b];
      if (!a || !c) return;
      const k1 = a.id + '>' + c.id, k2 = c.id + '>' + a.id;
      if (seen[k1] || seen[k2]) return;
      seen[k1] = 1;
      pairs.push([a.id, c.id, 'bridge']);
    });

    return { pos, mem, pools, evi, linkPairs: pairs };
  }

  function relationArc(a, b) {
    const ra = Math.hypot(a[0], a[1], a[2]);
    const rb = Math.hypot(b[0], b[1], b[2]);
    if (ra < 1e-8 || rb < 1e-8) return [a, b];
    const u = a.map(v => v / ra);
    const v = b.map(x => x / rb);
    const dot = clamp(u[0] * v[0] + u[1] * v[1] + u[2] * v[2], -1, 1);
    const angle = Math.acos(dot);
    let tangent = v.map((x, i) => x - u[i] * dot);
    let len = Math.hypot(tangent[0], tangent[1], tangent[2]);
    if (len < 1e-8) {
      const axis = Math.abs(u[0]) < 0.8 ? [1, 0, 0] : [0, 1, 0];
      const pr = axis[0] * u[0] + axis[1] * u[1] + axis[2] * u[2];
      tangent = axis.map((x, i) => x - pr * u[i]);
      len = Math.hypot(tangent[0], tangent[1], tangent[2]);
    }
    tangent = tangent.map(x => x / len);
    const points = [a];
    for (let i = 1; i < 24; i++) {
      const tt = i / 24;
      const radius = ra * (1 - tt) + rb * tt + sin(Math.PI * tt) * 0.012;
      points.push(u.map((x, k) => (x * cos(angle * tt) + tangent[k] * sin(angle * tt)) * radius));
    }
    points.push(b);
    return points;
  }

  function size() {
    const r = svg.getBoundingClientRect();
    return { w: Math.max(1, r.width), h: Math.max(1, r.height) };
  }

  async function load() {
    try {
      await window.maibot.ready;
      data = (await window.maibot.query('g', { limit: 220 })) || {};
    } catch (e) {
      data = { nodes: [], edges: [], bridges: [], pools: [], stats: {}, error: String(e) };
    }
    build();
    introStart = Date.now();
  }

  // ============================================================ 建 DOM（只一次）
  function build() {
    const nodes = data.nodes || [];
    laid = computeLayout(nodes, data.edges, data.bridges);
    map = {};

    topIds = {};
    laid.mem.slice().sort((a, b) => b.weight - a.weight).slice(0, 10)
      .forEach(n => { topIds[n.id] = 1; });

    const { w, h: hgt } = size();
    const cx = w / 2, cy = hgt / 2;
    const R = Math.min(w, hgt) * FOCAL_SCALE;

    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + hgt);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    // ---- 渐变（原版逐项照搬）
    const defs = h('defs', null,
      h('radialGradient', { id: 'chg-sphere-atmo' },
        h('stop', { offset: '62%', stopColor: '#7fc4ff', stopOpacity: '0' }),
        h('stop', { offset: '88%', stopColor: '#7fc4ff', stopOpacity: '0.10' }),
        h('stop', { offset: '100%', stopColor: '#7fc4ff', stopOpacity: '0' })),
      h('radialGradient', { id: 'chg-sphere', cx: '34%', cy: '30%', r: '72%' },
        h('stop', { offset: '0%', stopColor: '#8fd0ff', stopOpacity: '0.42' }),
        h('stop', { offset: '38%', stopColor: '#2f6bb0', stopOpacity: '0.22' }),
        h('stop', { offset: '78%', stopColor: '#12203a', stopOpacity: '0.85' }),
        h('stop', { offset: '100%', stopColor: '#070c16', stopOpacity: '0.95' })),
      POOL_SPEC.map(p => [
        h('radialGradient', { key: 'g' + p.key, id: 'chg-glow-' + p.key },
          h('stop', { offset: '0%', stopColor: '#ffffff', stopOpacity: '0.9' }),
          h('stop', { offset: '28%', stopColor: p.color, stopOpacity: '0.65' }),
          h('stop', { offset: '100%', stopColor: p.color, stopOpacity: '0' })),
        h('radialGradient', { key: 'b' + p.key, id: 'chg-bead-' + p.key, cx: '32%', cy: '28%', r: '75%' },
          h('stop', { offset: '0%', stopColor: '#ffffff' }),
          h('stop', { offset: '35%', stopColor: '#fff8ed' }),
          h('stop', { offset: '62%', stopColor: p.color }),
          h('stop', { offset: '100%', stopColor: p.color, stopOpacity: '0.85' })),
        h('radialGradient', { key: 'f' + p.key, id: 'chg-fog-' + p.key },
          h('stop', { offset: '0%', stopColor: p.color, stopOpacity: '0.17' }),
          h('stop', { offset: '45%', stopColor: p.color, stopOpacity: '0.07' }),
          h('stop', { offset: '100%', stopColor: p.color, stopOpacity: '0' })),
      ])
    );
    svg.appendChild(defs);

    const fogEls = laid.pools.map(p => h('circle', {
      key: 'fog-' + p.key, ref: slot('fog:' + p.key),
      cx: cx + p.cx * R, cy: cy + p.cy * R,
      r: Math.max(110, R * (0.40 + 0.05 * Math.sqrt(p.count))),
      fill: 'url(#chg-fog-' + p.key + ')', opacity: 0.85,
    }));

    const sphereEls = [
      h('circle', { key: 'atmo', ref: slot('sphere:atmo'), cx, cy, r: R * 0.46, fill: 'url(#chg-sphere-atmo)', opacity: 0.9 }),
      h('circle', { key: 'body', ref: slot('sphere:body'), cx, cy, r: R * 0.40, fill: 'url(#chg-sphere)', opacity: 0.96 }),
    ];

    // 边缘光是暖橙 —— 这是"球在哪"的唯一暗示
    const rimEls = [
      h('circle', { key: 'rim-glow', ref: slot('rim:glow'), cx, cy, r: R * 0.44, fill: 'none', stroke: '#ffb066', strokeOpacity: 0.16, strokeWidth: 7 }),
      h('circle', { key: 'rim', ref: slot('rim:edge'), cx, cy, r: R * 0.40, fill: 'none', stroke: '#ffc78a', strokeOpacity: 0.34, strokeWidth: 1.6 }),
    ];

    const eviEls = laid.evi.map(en => h('circle', {
      key: 'ev-' + en.id, 'data-role': 'evi', ref: slot(en.id),
      cx, cy, r: 0.7, fill: poolColor(en.pool), opacity: 0.07,
    }));

    const nodeEls = laid.mem.map(mn => h('g', {
      key: 'n-' + mn.id, className: 'chg-item', onClick: () => openPanel(mn),
    },
    h('circle', {
      key: 'halo', ref: el => { (map[mn.id] = map[mn.id] || {}).halo = el; },
      cx, cy, r: 2, fill: 'url(#chg-glow-' + mn.pool + ')', opacity: 0.2,
    }),
    h('circle', {
      key: 'dot', ref: el => { (map[mn.id] = map[mn.id] || {}).dot = el; },
      cx, cy, r: 1.4, fill: 'url(#chg-bead-' + mn.pool + ')', opacity: 0.9,
    }),
    labels && topIds[mn.id]
      ? h('text', {
        key: 'txt', ref: el => { (map[mn.id] = map[mn.id] || {}).txt = el; },
        className: 'chg-tip', x: cx, y: cy,
        style: { paintOrder: 'stroke', stroke: '#070b13', strokeWidth: '4px' },
      }, String(mn.label || '').slice(0, 14) + (String(mn.label || '').length > 14 ? '…' : ''))
      : null));

    // 池"团"：64 颗微粒，斐波那契球面撒点，中心密外圈稀
    const clusterEls = laid.pools.map(p => {
      const col = poolColor(p.key);
      const kids = [];
      for (let ci = 0; ci < CLUSTER_N; ci++) {
        const uy = 1 - (ci + 0.5) * 2 / CLUSTER_N;
        const rxz = Math.sqrt(Math.max(0, 1 - uy * uy));
        const phi = ci * 2.39996323;
        const rr = Math.cbrt((ci + 1) / CLUSTER_N) * (R * 0.048);
        kids.push(h('circle', {
          key: 'c' + ci,
          cx: (cos(phi) * rxz * rr).toFixed(1),
          cy: (uy * rr * 0.92).toFixed(1),
          r: (0.45 + hash01(p.key + 'cr' + ci) * 0.75).toFixed(2),
          fill: col,
          opacity: (0.16 + hash01(p.key + 'co' + ci) * 0.26).toFixed(2),
        }));
      }
      return h('g', {
        key: 'cl-' + p.key, className: 'chg-cluster',
        ref: slot('cluster:' + p.key), transform: 'translate(0,0)',
      }, kids);
    });

    const poolEls = laid.pools.map(p => {
      const col = poolColor(p.key);
      return h('g', { key: 'pl-' + p.key },
        h('circle', {
          key: 'halo', ref: el => { (map['pool:' + p.key] = map['pool:' + p.key] || {}).halo = el; },
          cx, cy, r: 12, fill: col, opacity: 0.09,
        }),
        h('circle', {
          key: 'dot', 'data-role': 'pool',
          ref: el => { (map['pool:' + p.key] = map['pool:' + p.key] || {}).dot = el; },
          cx, cy, r: 2.8, fill: col, opacity: 0.95,
        }),
        labels
          ? h('text', {
            key: 'txt', ref: el => { (map['pool:' + p.key] = map['pool:' + p.key] || {}).txt = el; },
            className: 'chg-tip chg-tip-pool', x: cx, y: cy,
          }, poolLabel(p.key) + ' ' + p.count)
          : null);
    });

    // 微尘：静态，不参与投影
    const dustEls = [];
    const DN = Math.min(900, laid.mem.length * 8);
    for (let di = 0; di < DN; di++) {
      const host = laid.mem[di % laid.mem.length];
      const hp = laid.pos[host.id];
      const dxs = (hash01('dx' + di) - 0.5) * 0.10;
      const dys = (hash01('dy' + di) - 0.5) * 0.08;
      dustEls.push(h('circle', {
        key: 'd-' + di,
        cx: cx + (hp.x + dxs) * R, cy: cy + (hp.y + dys) * R,
        r: 0.35 + hash01('dr' + di) * 0.4,
        fill: poolColor(host.pool),
        opacity: 0.02 + hash01('da' + di) * 0.06,
      }));
    }

    const lineEls = laid.linkPairs.map(pair => h('path', {
      key: 'ln-' + pair[0] + '>' + pair[1],
      ref: slot('ln:' + pair[0] + '>' + pair[1]),
      d: 'M0 0', fill: 'none',
      stroke: pair[2] === 'event' ? '#ffa64d' : '#7fc4ff',
      strokeWidth: pair[2] === 'event' ? 1.1 : 0.8,
      opacity: 0,
    }));

    // 层序：雾 → 球 → 边缘光 → 尘 → 线 → 依据 → 团 → 池心 → 点
    [fogEls, sphereEls, rimEls, dustEls, lineEls, eviEls, clusterEls, poolEls, nodeEls]
      .forEach(group => group.forEach(el => { if (el) svg.appendChild(el); }));

    // ---- 顶栏
    const st = data.stats || {};
    barEl.innerHTML = '';
    const mk = (tag, cls, text) => {
      const el = document.createElement(tag);
      if (cls) el.className = cls;
      if (text !== undefined) el.textContent = text;
      barEl.appendChild(el);
      return el;
    };
    mk('span', '', '共 ' + (st.total || laid.mem.length) + ' 条 · ' + laid.pools.length + ' 池 · ' + laid.mem.length + ' 点');
    if (st.bridges) mk('span', 'chg-k', '跨池 ' + st.bridges);
    const right = document.createElement('span');
    right.style.cssText = 'margin-left:auto;display:flex;gap:6px';
    barEl.appendChild(right);
    const mkBtn = (label, on, fn) => {
      const b = document.createElement('button');
      b.className = 'chg-btn';
      if (on) b.setAttribute('data-on', '1');
      b.textContent = label;
      b.onclick = fn;
      right.appendChild(b);
    };
    mkBtn('标签', labels, () => { labels = !labels; build(); });
    mkBtn('复位', false, () => { yaw = 0.6; pitch = 0.26; zoom = 1; vyaw = 0; vpitch = 0; openPanel(null); });

    emptyEl.style.display = laid.mem.length ? 'none' : 'flex';
  }

  // ============================================================ 投影
  function put(x, y, z, R, W, H) {
    const cY = cos(yaw), sY = sin(yaw);
    const x2 = x * cY + z * sY;
    const z2 = -x * sY + z * cY;
    const cX = cos(pitch), sX = sin(pitch);
    const y3 = y * cX - z2 * sX;
    const z3 = y * sX + z2 * cX;
    const k = FOCAL / (FOCAL + z3);
    return {
      sx: W / 2 + x2 * R * k * zoom * openE,
      sy: H / 2 + y3 * R * k * zoom * openE,
      k, z: z3,
    };
  }

  // ============================================================ 逐帧
  function drawFrame() {
    if (!laid.mem.length) return;
    const { w, h: hgt } = size();
    const R = Math.min(w, hgt) * FOCAL_SCALE;
    const W = w, H = hgt;

    const o0 = put(0, 0, 0, R, W, H);
    const body = map['sphere:body'] && map['sphere:body'].__el;
    const atmo = map['sphere:atmo'] && map['sphere:atmo'].__el;
    const rimEdge = map['rim:edge'] && map['rim:edge'].__el;
    const rimGlow = map['rim:glow'] && map['rim:glow'].__el;
    const rimR = SPHERE_R_DRAW * R * o0.k * zoom * openE;

    if (body) {
      body.setAttribute('cx', o0.sx.toFixed(1));
      body.setAttribute('cy', o0.sy.toFixed(1));
      body.setAttribute('r', (R * 0.40 * o0.k * zoom * openE).toFixed(1));
    }
    if (atmo) {
      atmo.setAttribute('cx', o0.sx.toFixed(1));
      atmo.setAttribute('cy', o0.sy.toFixed(1));
      atmo.setAttribute('r', (R * 0.46 * o0.k * zoom * openE).toFixed(1));
    }
    if (rimEdge) {
      rimEdge.setAttribute('cx', o0.sx.toFixed(1));
      rimEdge.setAttribute('cy', o0.sy.toFixed(1));
      rimEdge.setAttribute('r', rimR.toFixed(1));
    }
    if (rimGlow) {
      rimGlow.setAttribute('cx', o0.sx.toFixed(1));
      rimGlow.setAttribute('cy', o0.sy.toFixed(1));
      rimGlow.setAttribute('r', (rimR * 1.1).toFixed(1));
    }

    // 池心：整团绕球轴缓慢公转，池才不会钉死
    const ang = t * 0.06;
    const poolNow = {};
    laid.pools.forEach(p => {
      const x = p.cx * cos(ang) - p.cz * sin(ang);
      const z = p.cx * sin(ang) + p.cz * cos(ang);
      poolNow[p.key] = put(x, p.cy, z, R, W, H);
    });

    // 记忆点
    laid.mem.forEach(n => {
      const cur = laid.pos[n.id];
      const o = put(cur.x, cur.y, cur.z, R, W, H);
      const wgt = clamp(Number(n.weight) || 0.5, 0.1, 1);
      const ph = hash01(n.id) * 6.283 + hash01(n.id + 'p') * 3.1;
      const driftX = sin(t * 0.55 + ph) * 0.10;
      const driftY = cos(t * 0.43 + ph * 1.3) * 0.10;
      const rad = (1.05 + 1.45 * wgt) * o.k * (0.30 + 0.70 * openE);

      const el = map[n.id] || {};
      if (el.dot) {
        el.dot.setAttribute('cx', (o.sx + driftX).toFixed(1));
        el.dot.setAttribute('cy', (o.sy + driftY).toFixed(1));
        el.dot.setAttribute('r', Math.max(0.5, rad).toFixed(2));
        el.dot.setAttribute('opacity', clamp(0.30 + 0.70 * o.k, 0.12, 1).toFixed(3));
      }
      if (el.halo) {
        el.halo.setAttribute('cx', (o.sx + driftX).toFixed(1));
        el.halo.setAttribute('cy', (o.sy + driftY).toFixed(1));
        el.halo.setAttribute('r', Math.max(2, rad * 3.8).toFixed(2));
        el.halo.setAttribute('opacity', clamp(0.12 + 0.08 * o.k, 0.10, 0.24).toFixed(3));
      }
      if (el.txt) {
        el.txt.setAttribute('x', (o.sx + rad + 4).toFixed(1));
        el.txt.setAttribute('y', (o.sy + 3.2).toFixed(1));
      }
    });

    // 池：团平移、柔光、底雾跟着转
    laid.pools.forEach(p => {
      const o = poolNow[p.key];
      if (!o) return;
      const el = map['pool:' + p.key] || {};
      if (el.dot) {
        el.dot.setAttribute('cx', o.sx.toFixed(1));
        el.dot.setAttribute('cy', o.sy.toFixed(1));
        el.dot.setAttribute('r', (2.2 * Math.max(0.6, o.k)).toFixed(2));
      }
      if (el.halo) {
        el.halo.setAttribute('cx', o.sx.toFixed(1));
        el.halo.setAttribute('cy', o.sy.toFixed(1));
        el.halo.setAttribute('r', (12 * openE).toFixed(1));
      }
      const cl = map['cluster:' + p.key] && map['cluster:' + p.key].__el;
      if (cl) cl.setAttribute('transform', 'translate(' + o.sx.toFixed(1) + ',' + o.sy.toFixed(1) + ')');
      const fel = map['fog:' + p.key] && map['fog:' + p.key].__el;
      if (fel) {
        fel.setAttribute('cx', o.sx.toFixed(1));
        fel.setAttribute('cy', o.sy.toFixed(1));
        fel.setAttribute('r', Math.max(6, R * (0.05 + 0.010 * Math.sqrt(p.count)) * (0.92 + 0.08 * o.k) * openE).toFixed(1));
        fel.setAttribute('opacity', (clamp(0.55 + 0.45 * o.k, 0.3, 1) * (0.25 + 0.75 * openE)).toFixed(3));
      }
      if (el.txt) {
        el.txt.setAttribute('x', (o.sx + 9).toFixed(1));
        el.txt.setAttribute('y', (o.sy - 6).toFixed(1));
      }
    });

    // 依据微粒
    laid.evi.forEach(en => {
      const par = laid.pos[en.parent];
      if (!par) return;
      const o = put(par.x + en.ox, par.y + en.oy, par.z + en.oz, R, W, H);
      const el = map[en.id] && map[en.id].__el;
      if (!el) return;
      el.setAttribute('cx', o.sx.toFixed(1));
      el.setAttribute('cy', o.sy.toFixed(1));
      el.setAttribute('r', Math.max(0.4, 0.7 * o.k).toFixed(2));
      el.setAttribute('opacity', clamp(0.05 + 0.05 * o.k, 0.02, 0.12).toFixed(3));
    });

    // 连线：同事件贴球面短弧，跨池用微弯弦
    laid.linkPairs.forEach(pair => {
      const a = laid.pos[pair[0]], b = laid.pos[pair[1]];
      const el = map['ln:' + pair[0] + '>' + pair[1]] && map['ln:' + pair[0] + '>' + pair[1]].__el;
      if (!el || !a || !b) return;
      const oa = put(a.x, a.y, a.z, R, W, H);
      const ob = put(b.x, b.y, b.z, R, W, H);
      let d;
      if (pair[2] === 'bridge') {
        const dx = ob.sx - oa.sx, dy = ob.sy - oa.sy;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const bow = Math.min(18, len * 0.10) * ((hash01(pair[0] + pair[1]) - 0.5) * 2);
        d = 'M' + oa.sx.toFixed(1) + ' ' + oa.sy.toFixed(1) +
            'Q' + ((oa.sx + ob.sx) / 2 - (dy / len) * bow).toFixed(1) +
            ' ' + ((oa.sy + ob.sy) / 2 + (dx / len) * bow).toFixed(1) +
            ' ' + ob.sx.toFixed(1) + ' ' + ob.sy.toFixed(1);
      } else {
        const pts = relationArc([a.x, a.y, a.z], [b.x, b.y, b.z]);
        d = '';
        pts.forEach((pt, i) => {
          const o = put(pt[0], pt[1], pt[2], R, W, H);
          d += (i === 0 ? 'M' : 'L') + o.sx.toFixed(2) + ' ' + o.sy.toFixed(2);
        });
      }
      el.setAttribute('d', d);
      el.setAttribute('opacity',
        (clamp(0.035 + 0.105 * ((oa.k + ob.k) / 2), 0.02, 0.17) * openE).toFixed(3));
    });
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (now - last < FPS_MS) return;
    const dt = Math.min(0.06, (now - last) / 1000) || 0.033;
    last = now;
    t += dt;

    // 墙钟计时：rAF 在后台/无头里会被节流，用它的时间戳算开场会永远走不完
    openE = 0.55 + 0.45 * easeOut(clamp((Date.now() - introStart) / 1500, 0, 1));

    if (!dragging) {
      if (Math.abs(vyaw) > 0.0006 || Math.abs(vpitch) > 0.0006) {
        yaw += vyaw * dt;
        pitch = clamp(pitch + vpitch * dt, -1.2, 1.2);
        vyaw *= 0.94; vpitch *= 0.94;
      } else {
        yaw += dt * 0.075;
      }
    }
    drawFrame();
  }

  // ============================================================ 交互
  svg.addEventListener('pointerdown', e => {
    dragging = true; moved = 0; vyaw = 0; vpitch = 0;
    lastX = e.clientX; lastY = e.clientY;
    svg.setAttribute('data-dragging', '1');
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    yaw += dx * 0.006;
    pitch = clamp(pitch + dy * 0.005, -1.2, 1.2);
    vyaw = (dx * 0.006 / 0.033) * 0.35;
    vpitch = (dy * 0.005 / 0.033) * 0.35;
  });
  svg.addEventListener('pointerup', () => {
    dragging = false;
    svg.removeAttribute('data-dragging');
  });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    zoom = clamp(zoom * (e.deltaY > 0 ? 0.93 : 1.07), 0.55, 2.6);
  }, { passive: false });

  function openPanel(mn) {
    if (!mn) { panelEl.removeAttribute('data-in'); return; }
    const col = poolColor(mn.pool);
    panelEl.innerHTML =
      '<span class="chg-pool-tag" style="background:' + col + '22;color:' + col +
        ';border:1px solid ' + col + '55">' + poolLabel(mn.pool) + '</span>' +
      '<h4>' + (mn.label || '(无判断)') + '</h4>' +
      '<div class="chg-field"><span class="chg-field-k">权重</span>' + Number(mn.weight).toFixed(2) + '</div>' +
      '<div class="chg-field"><span class="chg-field-k">被想起</span>' + (mn.recalled || 0) + ' 次</div>' +
      '<div class="chg-field"><span class="chg-field-k">依据</span>' + (mn.eviCount || 0) + ' 条</div>' +
      '<button class="chg-back" id="chgBack">收起</button>';
    panelEl.setAttribute('data-in', '1');
    document.getElementById('chgBack').onclick = () => openPanel(null);
  }

  window.addEventListener('resize', () => build());
  window.addEventListener('maibot:context', () => build());

  load();
  requestAnimationFrame(frame);
})();
</script>
